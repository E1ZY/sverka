services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-audit-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d reconciliation"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    image: reconciliation-mvp:local
    environment:
      <<: &app-env
        DATABASE_URL: postgresql+psycopg://audit:${POSTGRES_PASSWORD:-local-audit-password}@db:5432/reconciliation
        DATA_DIR: /data
        EMBED_WORKER: "false"
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_MODE: ${AUTH_MODE:-password}
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      # Docker forwards localhost connections through its private bridge.
      AUTH_LOCAL_PROXY: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - documents:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    image: reconciliation-mvp:local
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    volumes:
      - documents:/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  documents:
